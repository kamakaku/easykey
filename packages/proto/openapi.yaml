openapi: 3.0.3
info:
  title: EasyKey API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/qr/challenge:
    post:
      summary: Create QR login challenge (stub)
      requestBody:
        required: false
      responses:
        '200':
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginId: { type: string }
                  nonce: { type: string }
                  expires: { type: integer, format: int64 }
